# Minimal broker config for RefLink's referee/HR/FMS sync (see server/src/core/mqtt.rs).
#
# Anonymous access is enabled by default since this is meant to run on a trusted network
# (matches how the redis service in docker-compose.yml also has no auth) - the whole point is
# tablets over Tailscale, not a publicly reachable broker. If this ever needs to be exposed more
# broadly, switch to `allow_anonymous false` plus a password_file (`mosquitto_passwd -b
# /mosquitto/config/passwd <user> <pass>`) and set MQTT_USERNAME/MQTT_PASSWORD in .env to match.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
