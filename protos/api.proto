syntax = "proto3";

package reflink.api;

import public "common.proto";

// ==========================
// Head/Referee Panel
// ==========================
//
// Referee panel and head referee state now travels over MQTT (see docs/mqtt topics), not gRPC -
// these messages are reused unchanged as MQTT payloads (encoded with the same
// `prost::Message`/Dart `fromBuffer` as before), just delivered differently. Only the two
// genuinely request/response-shaped actions below (ToggleBypass, CommitAndPost) stay as gRPC.

// ----- Client -> Server (published to reflink/referee-panel/{panel}/submit) -----

message RefereeStreamRequest {
  common.PanelType panel = 1;
  int32 match_id = 2;
  common.RefereePanelState state = 3;
}

// ----- Server -> Client (published, retained, to reflink/match/state) -----

message MatchStationState {
  string team_number = 1;
  bool bypassed = 2;
 common.TeamAllianceStationType alliance_station = 3;
}

message MatchAllianceState {
  MatchStationState alliance_team_1_state = 1;
  MatchStationState alliance_team_2_state = 2;
  MatchStationState alliance_team_3_state = 3;
}

// ----- Client -> Server (published to reflink/head-referee/submit) -----

message HeadRefereeStreamRequest {
  int32 match_id = 1;
  common.HeadRefereePanelState state = 2;
}

// ----- Server -> Client (published, retained, to reflink/match/state) -----
//
// The one shared broadcast every tablet (including HR) subscribes to. A regular referee panel
// derives its own "partner panel" locally from whichever of rn/rf/bn/bf matches its own panel
// type (the same pairing `partner_panel_state()` used to compute server-side), and reads
// `hr.ref_review_required` directly rather than a separate top-level duplicate of that field.
message HeadRefereeStreamResponse {
  int32 match_id = 1;
  common.MatchPhase match_phase = 2;
  MatchAllianceState red_alliance_state = 3;
  MatchAllianceState blue_alliance_state = 4;
  common.RefereePanelState rn = 5;
  common.RefereePanelState rf = 6;
  common.RefereePanelState bn = 7;
  common.RefereePanelState bf = 8;
  int32 rotate_in = 10;
  // Echoes back the server's authoritative (clamped) copy of the head referee's own
  // submitted state - notably `field_state`, since the one-way MATCH->COUNT->RESET
  // transition is enforced server-side, not by the submitting client.
  common.HeadRefereePanelState hr = 12;
}

// Fire-once, "ask Cheesy Arena to flip this station's bypass" - deliberately not part of
// HeadRefereeStreamRequest's persisted state. Cheesy Arena is the sole owner of whether a
// station is actually bypassed (already reflected back via MatchStationState.bypassed); we
// never store our own copy of "should this be bypassed" to reconcile against, since Cheesy's
// own `toggleBypass` is a plain toggle and anything else (the scorekeeper's own UI, a field
// reset) is just as entitled to flip it.
message ToggleBypassRequest {
  common.TeamAllianceStationType station = 1;
}
message ToggleBypassResponse {}

// Fire-once, "ask Cheesy Arena to commit the fouls/cards and post the score, then load the
// next match" - the same `commitAndPost` command Cheesy Arena's own referee panel and
// scorekeeper match play page send (see web/referee_panel.go). Only meaningful once the match
// has actually reached PostMatch; Cheesy Arena itself silently ignores it otherwise, so
// there's nothing extra to check client- or server-side.
message CommitAndPostRequest {}
message CommitAndPostResponse {}

service HeadRefereePanelService {
  rpc ToggleBypass(ToggleBypassRequest) returns (ToggleBypassResponse);
  rpc CommitAndPost(CommitAndPostRequest) returns (CommitAndPostResponse);
}
